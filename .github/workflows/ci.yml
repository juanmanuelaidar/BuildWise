name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: buildwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Verify migrations
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/buildwise
          AUTH_SECRET_KEY: buildwise-ci-test-secret
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic current
          alembic check

      - name: Run focused tesis regression checks
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/buildwise
          AUTH_SECRET_KEY: buildwise-ci-test-secret
          ENVIRONMENT: test
        run: pytest -q tests/test_series.py tests/test_temporal_leakage_tesis.py -o addopts=''

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/buildwise
          AUTH_SECRET_KEY: buildwise-ci-test-secret
          ENVIRONMENT: test
          RUN_POSTGRES_INTEGRATION: '1'
        run: |
          pytest --cov=app --cov-report=xml

      - name: Run canonical chat evaluation
        env:
          ENVIRONMENT: test
          AUTH_SECRET_KEY: buildwise-ci-test-secret
        run: pytest -m chat_evaluation -o addopts=''

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API and bootstrap images
        run: docker compose build --build-arg INSTALL_CMDSTAN=false api bootstrap

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Bootstrap deterministic dataset
        run: docker compose --profile ops run --rm bootstrap

      - name: Start API
        run: docker compose up -d api

      - name: Prepare ephemeral smoke credentials
        run: |
          SMOKE_ADMIN_PASSWORD="$(openssl rand -hex 18)"
          SMOKE_CLIENT_PASSWORD="$(openssl rand -hex 18)"
          echo "::add-mask::$SMOKE_ADMIN_PASSWORD"
          echo "::add-mask::$SMOKE_CLIENT_PASSWORD"
          echo "SMOKE_ADMIN_USERNAME=admin" >> "$GITHUB_ENV"
          echo "SMOKE_CLIENT_USERNAME=cliente" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_PASSWORD=$SMOKE_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SMOKE_CLIENT_PASSWORD=$SMOKE_CLIENT_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply ephemeral smoke credentials
        run: |
          docker compose exec -T \
            -e SMOKE_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" \
            -e SMOKE_CLIENT_PASSWORD="$SMOKE_CLIENT_PASSWORD" \
            api python -c "from sqlalchemy import select; from app.modules.auth.infrastructure.models import Usuario; from app.shared.database.session import SessionLocal; from app.shared.security.tokens import hash_password; db=SessionLocal(); admin=db.scalar(select(Usuario).where(Usuario.username == 'admin')); client=db.scalar(select(Usuario).where(Usuario.username == 'cliente')); admin.password_hash=hash_password('$SMOKE_ADMIN_PASSWORD'); client.password_hash=hash_password('$SMOKE_CLIENT_PASSWORD'); db.commit(); db.close()"

      - name: Wait for API health
        run: curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://127.0.0.1:8000/health

      - name: Run critical API smoke
        run: python scripts/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color api postgres

      - name: Stop smoke services
        if: always()
        run: docker compose stop api postgres
